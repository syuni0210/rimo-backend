server {
    listen 80;

    # 1. 인증 서버
    location /api/v1/auth/ {
        proxy_pass http://auth-server:8080;
    }

    # 2. 친구 / 회원 서버
    location /api/users {
        proxy_pass http://member-api-server:8081;
    }

    location /api/friends {
        proxy_pass http://member-api-server:8081;
    }

    location /api/member/ {
        proxy_pass http://member-api-server:8081;
    }

    location /api/guardians {
        proxy_pass http://member-api-server:8081;
    }

    # 3. 긴급구조 / 위치추적 서버
    location /api/tracking/ {
        proxy_pass http://tracking-api-server:8082;
    }

    # 4. 목적지 / 경로 서버
    location /api/route/ {
        proxy_pass http://route-api-server:8083;
    }

    # 5. AI 안전경로
    location /api/routes/ {
        proxy_pass http://route-api-server:8083;
    }

    # 6. 리포트 / 데이터 서버
    location /api/report/ {
        proxy_pass http://data-api-server:8084;
    }
}
